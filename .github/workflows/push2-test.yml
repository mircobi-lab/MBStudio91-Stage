name: Push2 Test

on:
  push:
    branches: ["**"]
    tags: ["push2-test-v*"]
    paths:
      - "tools/push2-test/**"
      - "Assets/Fonts/**"
      - ".github/workflows/push2-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push2-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (macOS Intel x86_64)
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: tools/push2-test
    steps:
      - uses: actions/checkout@v4

      - name: Cache dipendenze
        uses: actions/cache@v4
        with:
          path: tools/push2-test/build/_deps
          key: push2-deps-${{ runner.os }}-${{ hashFiles('tools/push2-test/CMakeLists.txt') }}

      - name: Configura (x86_64, macOS 12+)
        run: >
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Prove del protocollo
        run: |
          cmake --build build --target Push2ProtocolTests --config Release -- -quiet
          ctest --test-dir build -C Release --output-on-failure

      - name: Compila l'app
        run: cmake --build build --target MBStudio91Push2Test --config Release -- -quiet

      - name: Verifica architettura
        run: |
          BIN="build/MBStudio91Push2Test_artefacts/Release/MBStudio91 Push2 Test.app/Contents/MacOS/MBStudio91 Push2 Test"
          ARCHS=$(lipo -archs "$BIN")
          echo "Architetture: $ARCHS"
          test "$ARCHS" = "x86_64"
          # libusb e' compilata dentro l'app: non deve comparire tra le librerie esterne
          if otool -L "$BIN" | grep -i libusb; then exit 1; fi
          # l'icona deve essere finita nel bundle
          ICNS="build/MBStudio91Push2Test_artefacts/Release/MBStudio91 Push2 Test.app/Contents/Resources/Icon.icns"
          ls -la "$ICNS"
          sips -g pixelWidth -g pixelHeight "$ICNS" | tail -2

      - name: Crea lo zip
        run: |
          cd build/MBStudio91Push2Test_artefacts/Release
          ditto -c -k --keepParent "MBStudio91 Push2 Test.app" "$GITHUB_WORKSPACE/MBStudio91-Push2-Test-macOS-Intel.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MBStudio91-Push2-Test-macOS-Intel
          path: MBStudio91-Push2-Test-macOS-Intel.zip

      - name: Release (solo sui tag push2-test-v*)
        if: startsWith(github.ref, 'refs/tags/push2-test-v')
        uses: softprops/action-gh-release@v2
        with:
          files: MBStudio91-Push2-Test-macOS-Intel.zip
